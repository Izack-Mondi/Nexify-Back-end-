version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nexify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexify
      POSTGRES_PASSWORD: nexify_password
      POSTGRES_DB: nexify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexify -d nexify"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: nexify-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexify-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://nexify:nexify_password@postgres:5432/nexify?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      NODE_ENV: development
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_STORAGE_DIR: ${LOCAL_STORAGE_DIR:-/app/storage}
      LOCAL_STORAGE_PUBLIC_URL: ${LOCAL_STORAGE_PUBLIC_URL:-http://localhost:3000/storage}
      LOCAL_UPLOAD_SECRET: ${LOCAL_UPLOAD_SECRET:-${JWT_SECRET:-dev-secret-change-in-production}}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      MAX_VIDEO_BYTES: ${MAX_VIDEO_BYTES:-314572800}
      MAX_VIDEO_DURATION_SEC: ${MAX_VIDEO_DURATION_SEC:-600}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-10485760}
      UPLOAD_URL_EXPIRES_IN: ${UPLOAD_URL_EXPIRES_IN:-3600}
      MAX_CONCURRENT_UPLOADS: ${MAX_CONCURRENT_UPLOADS:-5}
      VIDEO_PROCESSING_TIMEOUT_MS: ${VIDEO_PROCESSING_TIMEOUT_MS:-900000}
      TEMP_DIR: ${TEMP_DIR:-/app/temp}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./temp:/app/temp
    command: ["sh", "-c", "npx prisma db push --skip-generate && node dist/main"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: nexify-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://nexify:nexify_password@postgres:5432/nexify?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      NODE_ENV: development
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_STORAGE_DIR: ${LOCAL_STORAGE_DIR:-/app/storage}
      LOCAL_STORAGE_PUBLIC_URL: ${LOCAL_STORAGE_PUBLIC_URL:-http://localhost:3000/storage}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      MAX_VIDEO_BYTES: ${MAX_VIDEO_BYTES:-314572800}
      MAX_VIDEO_DURATION_SEC: ${MAX_VIDEO_DURATION_SEC:-600}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-10485760}
      UPLOAD_URL_EXPIRES_IN: ${UPLOAD_URL_EXPIRES_IN:-3600}
      MAX_CONCURRENT_UPLOADS: ${MAX_CONCURRENT_UPLOADS:-5}
      VIDEO_PROCESSING_TIMEOUT_MS: ${VIDEO_PROCESSING_TIMEOUT_MS:-900000}
      TEMP_DIR: ${TEMP_DIR:-/app/temp}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./temp:/app/temp

volumes:
  postgres_data:
  redis_data:
